<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Education</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #2f6fed;
        --text: #18304b;
        --muted: #5f728c;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8fbff);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        width: min(92vw, 420px);
        background: var(--card);
        border-radius: 24px;
        box-shadow: 0 18px 45px rgba(31, 66, 122, 0.15);
        padding: 28px;
      }
      h1 { margin: 0 0 10px; font-size: 1.6rem; }
      p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
      .pill { display: inline-block; padding: 8px 12px; background: #eaf2ff; color: var(--primary); border-radius: 999px; font-size: 0.9rem; font-weight: 600; }
      .feature { margin-top: 18px; padding: 12px 14px; background: #f8fbff; border-radius: 14px; }
      button {
        margin-top: 18px; border: 0; background: var(--primary); color: white; padding: 12px 16px; border-radius: 12px; font-size: 1rem; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="pill">Preview ready</span>
      <h1>Sleep Education</h1>
      <p>This is a simple preview screen so you can see the app layout in the browser right away.</p>
      <div class="feature">💤 Sleep tips and education content will appear here.</div>
      <div class="feature">🌙 Personalized guidance and daily routines can be added next.</div>
      <button>View next step</button>
    </div>
  </body>
</html>
